# Corpus checks for this documents-only repository, next to conventions.yml.
#
# conventions.yml is the playbook guard workflow and owns the docs-conventions check (guard
# integrity, documentation conventions, security P0, commit messages). This workflow owns the
# corpus-integrity check, and it must not declare a second docs-conventions job: the structure
# checker (T6) fails a decoy that could satisfy that required context.
#
# Two gates, both dependency-free (the Python standard library only):
#   1. corpus integrity: bilingual parity, six-section structure, manifest agreement
#   2. generated-index drift: regenerating must produce no diff, so extended/ and the
#      docs/{ko,en}/INDEX.md files always match the corpus committed alongside them
#
# There is no application and no infrastructure in this repository, so there is no node
# toolchain, no AWS access, and no deploy job here. The web viewer that consumes
# extended/manifest.json lives in nerdkim/security-criteria-web.
name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Seoul

jobs:
  corpus:
    name: corpus-integrity
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","linux","x64"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test the corpus guards (playbook docs/00 D6)
        run: python3 tools/test_check_corpus.py

      - name: Corpus integrity (parity, structure, manifest agreement)
        run: python3 tools/check_corpus.py

      - name: Generated indexes match the corpus (no drift)
        run: |
          python3 tools/build_index.py
          # Stage first: git diff alone is blind to a generated file that is new or
          # deleted, so a missing index would pass. Nothing is committed in CI.
          git add -A -- extended docs
          if ! git diff --cached --exit-code -- extended docs; then
            echo "::error::the committed indexes are stale, or a generated file is missing or untracked. Run 'python3 tools/build_index.py' and commit the result."
            exit 1
          fi
